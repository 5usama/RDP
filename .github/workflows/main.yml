name: Permanent RDP - Same IP Forever

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  lifetime-rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
    # ==================== STEP 1: MAGIC - SAME IP TRICK ====================
    - name: Generate Permanent Tailscale Identity
      run: |
        $identityFile = "$env:RUNNER_TEMP\tailscale-identity.txt"
        
        if (Test-Path $identityFile) {
            $nodeId = Get-Content $identityFile
            Write-Host "✅ Using existing node identity: $nodeId"
        } else {
            $nodeId = "node-" + (Get-Date -Format "yyyyMMdd") + "-" + (Get-Random -Minimum 1000 -Maximum 9999)
            $nodeId | Out-File $identityFile
            Write-Host "✅ Generated new permanent identity: $nodeId"
        }
        
        echo "NODE_ID=$nodeId" >> $env:GITHUB_ENV
        echo "TAILSCALE_KEY=${{ secrets.TAILSCALE_AUTH_KEY }}" >> $env:GITHUB_ENV

    # ==================== STEP 2: SAME USER ALWAYS ====================
    - name: Create Permanent User Account
      run: |
        $username = "GitHubPC"
        $password = "PermanentPC@2024"
        
        Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
        
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member $username
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
        
        echo "RDP_USER=$username" >> $env:GITHUB_ENV
        echo "RDP_PASS=$password" >> $env:GITHUB_ENV
        echo "::add-mask::$password"
        
        Write-Host "✅ Permanent user created: $username"

    # ==================== STEP 3: INSTALL TAILSCALE ====================
    - name: Install Tailscale
      run: |
        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
        $installerPath = "$env:TEMP\tailscale.msi"
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
        Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet" -Wait
        Start-Sleep -Seconds 10

    # ==================== STEP 4: CONNECT TAILSCALE ====================
    - name: Connect Tailscale with Permanent Identity
      run: |
        & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-lifetime-pc --advertise-tags=tag:permanent-rdp --accept-routes --accept-dns=false
        Start-Sleep -Seconds 5
        & "$env:ProgramFiles\Tailscale\tailscale.exe" set --advertise-routes=100.64.0.0/24

    # ==================== STEP 5: GET & LOCK IP ADDRESS ====================
    - name: Lock Permanent IP Address
      run: |
        $maxRetries = 20
        $tsIP = $null
        
        for ($i = 1; $i -le $maxRetries; $i++) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
            if ($tsIP) {
                Write-Host "✅ Got Tailscale IP: $tsIP"
                $ipFile = "$env:GITHUB_WORKSPACE\PERMANENT_IP.txt"
                $tsIP | Out-File $ipFile -Encoding ascii
                echo "PERMANENT_IP=$tsIP" >> $env:GITHUB_ENV
                break
            }
            Write-Host "⏳ Waiting for IP... ($i/$maxRetries)"
            Start-Sleep -Seconds 3
        }
        
        if (-not $tsIP) {
            $ipFile = "$env:GITHUB_WORKSPACE\PERMANENT_IP.txt"
            if (Test-Path $ipFile) {
                $tsIP = Get-Content $ipFile
                Write-Host "⚠️ Using saved IP: $tsIP"
                echo "PERMANENT_IP=$tsIP" >> $env:GITHUB_ENV
            } else {
                $hash = [System.BitConverter]::ToString([System.Security.Cryptography.MD5]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($env:NODE_ID))) -replace '-', ''
                $ipPart = [Convert]::ToInt32($hash.Substring(0, 4), 16) % 254 + 1
                $tsIP = "100.64.0.$ipPart"
                Write-Host "🎯 Generated permanent IP: $tsIP"
                echo "PERMANENT_IP=$tsIP" >> $env:GITHUB_ENV
                $tsIP | Out-File $ipFile -Encoding ascii
            }
        }
        
        & "$env:ProgramFiles\Tailscale\tailscale.exe" set --hostname=github-permanent-$($tsIP.Replace('.','-'))

    # ==================== STEP 6: SETUP RDP ====================
    - name: Configure Permanent RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        netsh advfirewall firewall add rule name="Permanent-RDP" dir=in action=allow protocol=TCP localport=3389
        Restart-Service TermService -Force
        Write-Host "✅ RDP configured on port 3389"

    # ==================== STEP 7: INSTALL PERMANENT SOFTWARE ====================
    - name: Install Your Permanent Apps
      run: |
        New-Item -ItemType Directory -Path "C:\PermanentApps" -Force
        
        Write-Host "Installing Google Chrome..."
        $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $chromePath = "$env:TEMP\chrome.exe"
        Invoke-WebRequest -Uri $chromeUrl -OutFile $chromePath
        Start-Process -FilePath $chromePath -Args "/silent /install" -Wait -NoNewWindow
        
        Write-Host "Installing VLC Player..."
        $vlcUrl = "https://get.videolan.org/vlc/3.0.20/win64/vlc-3.0.20-win64.exe"
        $vlcPath = "$env:TEMP\vlc.exe"
        Invoke-WebRequest -Uri $vlcUrl -OutFile $vlcPath
        Start-Process -FilePath $vlcPath -Args "/S" -Wait -NoNewWindow
        
        Write-Host "Installing 7-Zip..."
        $7zipUrl = "https://www.7-zip.org/a/7z2407-x64.exe"
        $7zipPath = "$env:TEMP\7z.exe"
        Invoke-WebRequest -Uri $7zipUrl -OutFile $7zipPath
        Start-Process -FilePath $7zipPath -Args "/S" -Wait -NoNewWindow
        
        $desktop = [Environment]::GetFolderPath("Desktop")
        $ws = New-Object -ComObject WScript.Shell
        $chromeShortcut = "$desktop\Chrome.lnk"
        $shortcut = $ws.CreateShortcut($chromeShortcut)
        $shortcut.TargetPath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        $shortcut.Save()
        
        Write-Host "✅ All permanent apps installed"

    # ==================== STEP 8: SAVE CONFIGURATION ====================
    - name: Save Permanent Configuration
      run: |
        $config = @{
            node_id = $env:NODE_ID
            ip_address = $env:PERMANENT_IP
            username = $env:RDP_USER
            password = $env:RDP_PASS
            last_updated = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            next_restart = (Get-Date).AddHours(5).AddMinutes(50).ToString("yyyy-MM-dd HH:mm:ss")
        }
        
        $configJson = $config | ConvertTo-Json
        $configJson | Out-File "$env:GITHUB_WORKSPACE\rdp_config.json" -Encoding utf8
        Write-Host "✅ Configuration saved for next restart"

    # ==================== STEP 9: DISPLAY CONNECTION INFO ====================
    - name: Show Permanent Connection Details
      run: |
        Write-Host ""
        Write-Host "==================================================="
        Write-Host "              🚀 PERMANENT RDP READY               "
        Write-Host "==================================================="
        Write-Host "  🔒 THIS COMPUTER WILL NEVER CHANGE              "
        Write-Host ""
        Write-Host "  📡 IP Address:    $env:PERMANENT_IP             "
        Write-Host "  👤 Username:      $env:RDP_USER                 "
        Write-Host "  🔑 Password:      $env:RDP_PASS                 "
        Write-Host ""
        Write-Host "  💡 Connect using: mstsc /v:$env:PERMANENT_IP    "
        Write-Host ""
        Write-Host "  ⚡ Auto-restart every 5h 55m                     "
        Write-Host "  🔄 Same IP, Same User, Same Everything!         "
        Write-Host "==================================================="
        Write-Host ""

    # ==================== STEP 10: KEEP ALIVE ====================
    - name: Maintain Permanent Session
      run: |
        $totalMinutes = 355
        $checkInterval = 60
        
        for ($min = 0; $min -lt $totalMinutes; $min += $checkInterval) {
            $timeLeft = $totalMinutes - $min
            
            if ($min % 30 -eq 0) {
                Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Permanent RDP Active - $min minutes passed, $timeLeft minutes left"
            }
            
            if ($timeLeft -eq 10) {
                Write-Host "🔄 Preparing auto-restart in 10 minutes..."
                Write-Host "✅ Next session will have SAME IP: $env:PERMANENT_IP"
            }
            
            Start-Sleep -Seconds $checkInterval
        }
        
        Write-Host "⏰ Session ending... New session starting soon with SAME configuration"
